<!doctype html>
<html>
<head><style>
  body { margin: 0; font: 14px sans-serif; background: #ffffff; }
  #inventory { height: 120px; overflow-y: auto; border: 1px solid #ccc; }
  #inventory div { height: 40px; }
  #tags { width: 200px; overflow-x: auto; white-space: nowrap; }
  #tags span { display: inline-block; width: 120px; }
  #ghost { color: rgb(255, 255, 255); background: transparent; }
  #exiled { position: absolute; left: -9999px; }
  #gone { display: none; }
  #stage { position: relative; height: 60px; }
  #beneath { position: absolute; top: 0; left: 0; width: 200px; height: 40px; }
  #toast { position: absolute; top: 0; left: 0; width: 200px; height: 40px; background: #333; color: #fff; }
  .sr-only { position: absolute; width: 1px; height: 1px; clip: rect(0 0 0 0); overflow: hidden; }
</style></head>
<body>
  <div id="inventory" aria-label="Inventory list">
    <div>staging-db</div><div>prod-db</div><div>cache-1</div>
    <div>cache-2</div><div>queue-1</div><div>queue-2</div>
  </div>

  <div id="tags" aria-label="Tag strip">
    <span>alpha</span><span>beta</span><span>gamma</span><span>delta</span>
  </div>

  <p id="ghost">Saved successfully</p>
  <p id="exiled">Archived record</p>
  <p id="gone">Never rendered</p>
  <span class="sr-only">Skip to content</span>

  <div id="stage">
    <button id="beneath">Confirm order</button>
    <div id="toast" aria-label="Notification">Network error</div>
  </div>

  <p id="plain">A perfectly ordinary paragraph</p>
</body>
</html>
